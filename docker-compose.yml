name: webshop-pro-lab

# ╔════════════════════════════════════════════════════════════════════╗
# ║  PROFILE SYSTEM — csak azt indítsd, ami a kurzushoz kell!       ║
# ║                                                                   ║
# ║  docker compose up -d                         → core (~512 MB)  ║
# ║  docker compose --profile sql up -d           → core (SQL csak postgres)  ║
# ║  docker compose --profile docker up -d        → core + minio, spark, airflow, monitoring  ║
# ║  docker compose --profile airflow up -d       → core + airflow              ║
# ║  docker compose --profile dbt up -d           → core + dbt                  ║
# ║  docker compose --profile delta up -d         → core + minio, spark, lab    ║
# ║  docker compose --profile spark up -d         → core + spark, databricks, mlflow, unity  ║
# ║  docker compose --profile databricks up -d    → core + databricks, spark, mlflow, unity  ║
# ║  docker compose --profile streaming up -d     → core + kafka, spark, kafka-ui  ║
# ║  docker compose --profile otf up -d           → core + minio, lab, unity     ║
# ║  docker compose --profile python up -d        → core + lab-runner (nehéz)    ║
# ║  docker compose --profile ai-eng up -d        → core + chroma, streamlit, api, mlflow  ║
# ║  docker compose --profile ai-de up -d         → core + kafka, minio, lab, mlflow  ║
# ║  docker compose --profile aiops up -d         → core + mlflow, api, monitoring  ║
# ║  docker compose --profile llmops up -d        → core + mlflow, api, monitoring  ║
# ║  docker compose --profile local-llm up -d     → core + chroma, api, streamlit, monitoring ║
# ║  docker compose --profile rag up -d           → core + chroma, lab, mlflow   ║
# ║  docker compose --profile governance up -d    → core + unity, lab, monitoring ║
# ║  docker compose --profile mesh up -d          → core + dbt, unity, lab, minio ║
# ║  docker compose --profile agentic up -d       → core + api, streamlit, monitoring ║
# ║  docker compose --profile all up -d           → MINDEN (~7 GB)              ║
# ╚════════════════════════════════════════════════════════════════════╝

services:
  # ─── CORE (mindig elindul, nem kell profile) ───────────────────

  course-site:
    image: nginx:1.27-alpine
    container_name: webshop-course-site
    ports:
      - "8020:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      webshop.course: "all"
      webshop.role: "Static course site"

  webshop:
    image: nginx:1.27-alpine
    container_name: webshop-pro-demo
    ports:
      - "8010:80"
    volumes:
      - ./webshop-pro:/usr/share/nginx/html/webshop-pro:ro
      - ./webshop-lab:/usr/share/nginx/html/webshop-lab:ro
      - ./webshop-lab/nginx/webshop.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      webshop.course: "project"
      webshop.role: "Dummy webshop frontend"

  postgres:
    image: postgres:16-alpine
    container_name: webshop-postgres
    environment:
      POSTGRES_DB: webshop
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: webshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./webshop-lab/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webshop -d webshop"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      webshop.course: "sql-data-modeling,docker-local-data-platform"
      webshop.role: "Relational source and serving database"

  adminer:
    image: adminer
    container_name: webshop-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      webshop.course: "all"
      webshop.role: "PostgreSQL web UI"

  # ─── STORAGE (minio) ───────────────────────────────────────────

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: webshop-minio
    profiles: ["docker", "delta", "otf", "ai-de", "governance", "mesh", "all"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      webshop.course: "docker-local-data-platform,delta-table-crash-course,open-table-formats,data-governance,data-mesh"
      webshop.role: "S3-compatible object storage for bronze/silver/gold layers"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: webshop-minio-init
    profiles: ["docker", "delta", "otf", "ai-de", "governance", "mesh", "all"]
    depends_on:
      minio:
        condition: service_started
    volumes:
      - ./webshop-pro/fixtures:/fixtures:ro
      - ./webshop-pro/project-map.json:/project-map.json:ro
      - ./webshop-lab/docs:/docs:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO...'; sleep 2; done;
      mc mb -p local/webshop-bronze local/webshop-silver local/webshop-gold local/webshop-artifacts || true;
      mc cp /fixtures/*.json local/webshop-bronze/source/ || true;
      mc cp /project-map.json local/webshop-artifacts/course-materials/project-map.json || true;
      mc cp --recursive /docs/ local/webshop-artifacts/course-materials/docs/ || true;
      echo 'MinIO buckets created and webshop fixtures copied.'"

  # ─── STREAMING (kafka) ─────────────────────────────────────────

  kafka:
    image: apache/kafka:3.9.1
    container_name: webshop-kafka
    profiles: ["streaming", "ai-de", "all"]
    hostname: kafka
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms128m"
    ports:
      - "9092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      webshop.course: "streaming-engineering,ai-data-engineer"
      webshop.role: "Clickstream and checkout event bus"

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: webshop-kafka-init
    profiles: ["streaming", "ai-de", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic webshop.events --partitions 3 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic webshop.orders --partitions 3 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic webshop.support --partitions 1 --replication-factor 1;
      echo 'Kafka topics created.'"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: webshop-kafka-ui
    profiles: ["streaming", "ai-de", "all"]
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      webshop.course: "streaming-engineering,ai-data-engineer"
      webshop.role: "Kafka topic browser and consumer lag viewer"

  # ─── SPARK ─────────────────────────────────────────────────────

  spark-master:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: webshop-spark-master
    profiles: ["docker", "delta", "spark", "streaming", "databricks", "all"]
    user: root
    environment:
      SPARK_MASTER_OPTS: "-Dspark.master.rest.enabled=true"
      SPARK_MASTER_MEMORY: "1g"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "6066:6066"
      - "8090:8080"
    volumes:
      - ./webshop-lab:/opt/webshop-lab
      - ./webshop-pro/fixtures:/opt/webshop-fixtures:ro
      - lab-output:/opt/webshop-output
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      webshop.course: "spark-crash-course,delta-table-crash-course,streaming-engineering,ai-data-engineer"
      webshop.role: "Spark master for ETL and feature jobs"

  spark-worker:
    image: apache/spark:3.5.3-scala2.12-java17-python3-ubuntu
    container_name: webshop-spark-worker
    profiles: ["docker", "delta", "spark", "streaming", "databricks", "all"]
    user: root
    environment:
      SPARK_WORKER_MEMORY: "1g"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - "1G"
      - --webui-port
      - "8081"
    ports:
      - "8091:8081"
    volumes:
      - ./webshop-lab:/opt/webshop-lab
      - ./webshop-pro/fixtures:/opt/webshop-fixtures:ro
      - lab-output:/opt/webshop-output
    depends_on:
      spark-master:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      webshop.course: "spark-crash-course,delta-table-crash-course,streaming-engineering"

  # ─── ORCHESTRATION ─────────────────────────────────────────────

  airflow:
    image: apache/airflow:2.10.3-python3.11
    container_name: webshop-airflow
    profiles: ["docker", "airflow", "all"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_HOME: /opt/airflow
    ports:
      - "8088:8080"
    volumes:
      - ./webshop-lab/airflow/dags:/opt/airflow/dags:ro
      - ./webshop-pro/fixtures:/opt/webshop-fixtures:ro
      - lab-output:/opt/webshop-output
    user: root
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "set -e;
      export PATH=\"/home/airflow/.local/bin:$${PATH}\";
      install -d -m 0775 -o airflow -g root /opt/airflow /opt/airflow/logs /opt/airflow/plugins;
      if [ -f /opt/airflow/airflow.db ]; then chown airflow:root /opt/airflow/airflow.db; fi;
      chown -R airflow:root /opt/airflow/logs /opt/airflow/plugins;
      install -d -m 0777 -o airflow -g root /opt/webshop-output /opt/webshop-output/airflow /opt/webshop-output/spark;
      chown -R airflow:root /opt/webshop-output;
      chmod -R a+rwX /opt/webshop-output;
      exec su airflow -s /bin/bash -c 'export PATH=\"/home/airflow/.local/bin:$${PATH}\";
      airflow db migrate;
      airflow users create --username admin --password admin --firstname WebShop --lastname Admin --role Admin --email admin@example.com || true;
      airflow scheduler > /tmp/airflow-scheduler.log 2>&1 &
      exec airflow webserver'"
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      webshop.course: "airflow-orchestration"
      webshop.role: "Daily webshop DAG orchestration"

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest
    container_name: webshop-dbt
    profiles: ["dbt", "mesh", "all"]
    working_dir: /usr/app
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "dbt debug --profiles-dir /usr/app/profiles &&
      dbt run --profiles-dir /usr/app/profiles &&
      dbt test --profiles-dir /usr/app/profiles &&
      dbt docs generate --profiles-dir /usr/app/profiles &&
      dbt docs serve --profiles-dir /usr/app/profiles --host 0.0.0.0 --port 8080"
    ports:
      - "8092:8080"
    volumes:
      - ./webshop-lab/dbt:/usr/app
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      webshop.course: "dbt-analytics-engineering,ai-data-engineer,data-mesh"
      webshop.role: "Analytics engineering models and docs"

  # ─── ML / MONITORING ───────────────────────────────────────────

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.3
    container_name: webshop-mlflow
    profiles: ["spark", "databricks", "ai-eng", "ai-de", "aiops", "llmops", "local-llm", "rag", "agentic", "all"]
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      webshop.course: "aiops-mlops,llmops-genai-production,databricks-lakehouse,agentic-ai,local-llm-engineering"
      webshop.role: "Experiment tracking, model registry and prompt/version metadata"

  api:
    build:
      context: ./webshop-lab/api
    container_name: webshop-fastapi
    profiles: ["ai-eng", "ai-de", "aiops", "llmops", "local-llm", "agentic", "all"]
    environment:
      DATABASE_URL: postgresql://webshop:webshop@postgres:5432/webshop
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CHROMA_URL: http://chroma:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      webshop.course: "aiops-mlops,llmops-genai-production,agentic-ai,local-llm-engineering"
      webshop.role: "FastAPI serving layer for webshop app and churn prediction"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: webshop-prometheus
    profiles: ["docker", "aiops", "llmops", "local-llm", "governance", "agentic", "all"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./webshop-lab/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      webshop.course: "docker-local-data-platform,aiops-mlops,llmops-genai-production,data-governance,agentic-ai,local-llm-engineering"
      webshop.role: "Metrics collection"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: webshop-grafana
    profiles: ["docker", "aiops", "llmops", "local-llm", "governance", "agentic", "all"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./webshop-lab/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./webshop-lab/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      webshop.course: "docker-local-data-platform,aiops-mlops,llmops-genai-production,data-governance,agentic-ai,local-llm-engineering"
      webshop.role: "Dashboards for business, API and model health"

  # ─── AI ────────────────────────────────────────────────────────

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: webshop-chroma
    profiles: ["ai-eng", "local-llm", "rag", "agentic", "all"]
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      webshop.course: "ai-engineering,rag-evaluation-ai-safety,agentic-ai,local-llm-engineering"
      webshop.role: "Vector database for support-policy retrieval"

  streamlit:
    build:
      context: ./webshop-lab/streamlit
    container_name: webshop-streamlit
    profiles: ["ai-eng", "local-llm", "agentic", "all"]
    environment:
      API_URL: http://api:8000
      CHROMA_URL: http://chroma:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
      chroma:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      webshop.course: "ai-engineering,agentic-ai,local-llm-engineering"
      webshop.role: "RAG/support demo UI"

  # ─── DATABRICKS ────────────────────────────────────────────────

  unity-catalog:
    image: unitycatalog/unitycatalog:main
    container_name: webshop-unity-catalog
    profiles: ["spark", "databricks", "otf", "governance", "mesh", "all"]
    ports:
      - "8089:8080"
    volumes:
      - unity-catalog-data:/opt/unitycatalog/etc/data
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      webshop.course: "databricks-lakehouse,open-table-formats,data-governance,data-mesh"
      webshop.role: "OSS Unity Catalog server for local governance practice"

  databricks-local:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.0
    container_name: webshop-databricks-local
    profiles: ["spark", "databricks", "all"]
    command: start-notebook.py --ServerApp.token='' --ServerApp.password=''
    ports:
      - "8888:8888"
    volumes:
      - ./webshop-lab:/home/jovyan/webshop-lab
      - ./webshop-pro/fixtures:/home/jovyan/webshop-fixtures:ro
      - lab-output:/home/jovyan/webshop-output
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SPARK_MASTER: spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_started
      mlflow:
        condition: service_started
        required: false
      unity-catalog:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
    labels:
      webshop.course: "databricks-lakehouse,spark-crash-course"
      webshop.role: "Local notebook workspace that mirrors Databricks learning flows"

  # ─── LAB PLAYGROUND ────────────────────────────────────────────

  lab-runner:
    build:
      context: ./webshop-lab/runner
    container_name: webshop-lab-runner
    profiles: ["python", "delta", "otf", "ai-de", "local-llm", "rag", "governance", "mesh", "agentic", "all"]
    command: tail -f /dev/null
    environment:
      DATABASE_URL: postgresql://webshop:webshop@postgres:5432/webshop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CHROMA_URL: http://chroma:8000
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./webshop-lab:/lab
      - ./webshop-pro/fixtures:/fixtures:ro
      - lab-output:/output
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
      api:
        condition: service_healthy
        required: false
      minio:
        condition: service_started
        required: false
      chroma:
        condition: service_started
        required: false
      mlflow:
        condition: service_started
        required: false
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      webshop.course: "python-data-engineering,delta-table-crash-course,open-table-formats,ai-data-engineer,rag-evaluation-ai-safety,data-governance,data-mesh,agentic-ai,local-llm-engineering"
      webshop.role: "Python/pandas/Parquet/Delta/Iceberg/GE/Feast/RAGAS playground"

  event-producer:
    build:
      context: ./webshop-lab/runner
    container_name: webshop-event-producer
    profiles: ["streaming", "all"]
    command: python /lab/runner/scripts/produce_events.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./webshop-lab:/lab
      - ./webshop-pro/fixtures:/fixtures:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    labels:
      webshop.course: "streaming-engineering"
      webshop.role: "Publishes fixture clickstream events to Kafka"

  lab-bootstrap:
    build:
      context: ./webshop-lab/runner
    container_name: webshop-lab-bootstrap
    profiles: ["all"]
    command: /bin/sh -lc "python /lab/runner/scripts/bootstrap_lab.py && tail -f /dev/null"
    environment:
      DATABASE_URL: postgresql://webshop:webshop@postgres:5432/webshop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CHROMA_URL: http://chroma:8000
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./webshop-lab:/lab
      - ./webshop-pro/fixtures:/fixtures:ro
      - lab-output:/output
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      chroma:
        condition: service_started
      mlflow:
        condition: service_started
    labels:
      webshop.course: "all"
      webshop.role: "Predefined data seed, Chroma policy docs, MLflow demo run"

volumes:
  postgres-data:
  minio-data:
  lab-output:
  mlflow-data:
  chroma-data:
  prometheus-data:
  grafana-data:
  unity-catalog-data:
