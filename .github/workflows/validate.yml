name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  html-structure:
    name: HTML structure check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate course HTML structure
        run: |
          python <<'PY'
          from pathlib import Path
          import re, sys

          courses = [
              'sql-data-modeling','python-data-engineering','docker-local-data-platform',
              'delta-table-crash-course','open-table-formats','spark-crash-course',
              'airflow-orchestration','dbt-analytics-engineering','databricks-lakehouse',
              'streaming-engineering','ai-data-engineer','ai-engineering',
              'rag-evaluation-ai-safety','llmops-genai-production','aiops-mlops',
              'data-mesh','data-governance','agentic-ai',
          ]
          fails = []
          for c in courses:
              f = Path(c) / 'index.html'
              if not f.exists():
                  fails.append(f"{c}: missing index.html"); continue
              s = f.read_text(encoding='utf-8')
              if s.count('review-banner') != 1:
                  fails.append(f"{c}: review-banner count != 1")
              if s.count('<div') != s.count('</div>'):
                  fails.append(f"{c}: div tags unbalanced")
              if s.count('<pre') != s.count('</pre>'):
                  fails.append(f"{c}: pre tags unbalanced")
              sec = len(re.findall(r'class="section ', s))
              m = re.search(r'(\d+) / (\d+) section completed', s)
              if m and int(m.group(2)) != sec:
                  fails.append(f"{c}: progress text {m.group(2)} != actual sections {sec}")
          if fails:
              print("FAIL:")
              for x in fails: print(f"  - {x}")
              sys.exit(1)
          print(f"OK: {len(courses)} courses validated")
          PY

      - name: Validate courses.json
        run: |
          python <<'PY'
          import json, sys
          from pathlib import Path

          d = json.load(open('courses.json', encoding='utf-8'))
          fails = []
          for c in d:
              if c.get('status') != 'Kész':
                  fails.append(f"{c['slug']}: status != 'Kész'")
              if c.get('url'):
                  if not Path(c['url']).exists():
                      fails.append(f"{c['slug']}: url points to missing file {c['url']}")
          if fails:
              for x in fails: print(f"FAIL: {x}")
              sys.exit(1)
          print(f"OK: {len(d)} courses in JSON")
          PY

  smoke-test:
    name: Smoke test core deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal core
        run: |
          python -m pip install --upgrade pip
          # Csak a core data csomagok — a pyspark/airflow nehéz, és nem kritikus a CI-hez
          pip install pandas pyarrow numpy duckdb pydantic pytest deltalake requests
      - name: Run smoke test
        run: python smoke_test.py

  shell-syntax:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n bootstrap.sh
      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/bootstrap.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "bootstrap.ps1 syntax OK"

  yaml-validate:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate docker-compose.yml
        run: |
          python -m pip install pyyaml
          python -c "
          import yaml
          d = yaml.safe_load(open('docker-compose.yml'))
          assert 'services' in d
          assert len(d['services']) > 0
          print(f'OK: {len(d[\"services\"])} services, {len(d.get(\"volumes\", {}))} volumes')
          "
